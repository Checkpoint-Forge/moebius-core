<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Moebius Core · 墨线管线 Demo</title>
<style>
  :root {
    /* 关键：告诉浏览器原生控件（select 弹层、滚动条、number 箭头）走暗色，
       否则下拉选项会是系统白底 + 继承来的浅色文字 = 白底白字。 */
    color-scheme: dark;
    --ink: #eae1d2;
    --dim: #93a0a7;
    --faint: #67757e;
    --accent: #8fd0c8;
    --warn: #e5a75a;
    --line: rgba(234, 225, 210, 0.12);
    --line-strong: rgba(234, 225, 210, 0.24);
    --panel: #0d1a22;
    --panel-soft: #14262f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

    /* 排版栅格：标签自适应 / 数值定宽 / 单位定宽。所有行共用，数值才会同 x 对齐。 */
    --value-width: 64px;
    --unit-width: 20px;
    --row-gap: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    /* 画布是透明清屏，这层渐变就是"天"。下半段必须正好等于雾色
       (PALETTE.fogPale = #e7bfa8)，地面在雾里消融时地平线才不会咬出一条缝。 */
    background: linear-gradient(180deg, #9dc2c9 0%, #c8cfc6 26%, #e7bfa8 46%, #e7bfa8 100%);
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }

  #scene:active { cursor: grabbing; }

  #readout {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 3;
    padding: 6px 10px;
    border: 1px solid var(--line);
    background: rgba(9, 20, 27, 0.78);
    color: var(--dim);
    font: 11px/1.4 var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: pre;
  }

  /* ---------------------------------------------------------------- 面板 */
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 340px;
    z-index: 4;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-left: 1px solid var(--line-strong);
    background: linear-gradient(180deg, var(--panel) 0%, #0a161d 100%);
    /* 不要加 backdrop-filter: blur()：它会强制把下层 WebGL 画布读进合成器，
       在软件渲染（无头/虚拟机）下直接让 GL context 丢失，画布变白。 */
    font-size: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }

  #panel header {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 13px 14px 11px;
    border-bottom: 1px solid var(--line-strong);
    background: var(--panel);
  }

  #panel h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  #panel .sub {
    margin: 3px 0 0;
    color: var(--faint);
    font: 10px var(--mono);
  }

  .bar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    margin-top: 10px;
    align-items: center;
  }

  .ghost {
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: transparent;
    color: var(--dim);
    font: 11px var(--mono);
    cursor: pointer;
    white-space: nowrap;
  }

  .ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------------------------------------------------------------- 汇总 */
  .summary {
    display: grid;
    grid-template-columns: 34px 1fr;
    row-gap: 3px;
    column-gap: 8px;
    margin: 11px 0 0;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.025);
    font: 10.5px/1.5 var(--mono);
  }

  .summary dt { color: var(--faint); }

  .summary dd {
    margin: 0;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary dd.is-changed { color: var(--warn); }

  /* ---------------------------------------------------------------- 折叠分区 */
  .section { border-bottom: 1px solid var(--line); }

  .section > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 14px;
    cursor: pointer;
    list-style: none;
    user-select: none;
    color: var(--ink);
    font: 500 11.5px var(--mono);
    letter-spacing: 0.05em;
  }

  .section > summary::-webkit-details-marker { display: none; }

  .section > summary::before {
    content: "";
    flex: none;
    width: 5px;
    height: 5px;
    border-right: 1.5px solid var(--faint);
    border-bottom: 1.5px solid var(--faint);
    transform: rotate(-45deg);
    transition: transform 0.15s ease;
  }

  .section[open] > summary::before { transform: rotate(45deg); }
  .section > summary:hover { background: rgba(255, 255, 255, 0.03); }

  .section-title { flex: 1; }

  .section-note {
    color: var(--faint);
    font: 9.5px var(--mono);
    letter-spacing: 0;
  }

  .section > *:not(summary) {
    margin-left: 14px;
    margin-right: 14px;
  }

  .section > *:last-child { margin-bottom: 10px; }

  /* ---------------------------------------------------------------- 开关 */
  .toggle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
    padding: 4px 0 6px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    cursor: pointer;
    color: var(--ink);
    font-size: 11.5px;
  }

  .toggle-wide { padding: 2px 0 4px; }
  .toggle input { flex: none; accent-color: var(--accent); margin: 0; }

  /* ---------------------------------------------------------------- 参数行
     固定两行：上排「标签 | 数值 | 单位」，下排通栏滑杆。行高一致、数值列同 x。 */
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--value-width) var(--unit-width);
    align-items: center;
    column-gap: var(--row-gap);
    padding: 5px 0;
  }

  .row-label {
    overflow: hidden;
    color: var(--ink);
    font-size: 11.5px;
    line-height: 16px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-value {
    width: 100%;
    height: 18px;
    padding: 0 3px;
    border: 1px solid transparent;
    border-radius: 2px;
    background: transparent;
    color: var(--accent);
    font: 11px/16px var(--mono);
    text-align: right;
    font-variant-numeric: tabular-nums;
    /* 去掉 spin 按钮：它会把 64px 的数值框挤歪，而这层窗口不需要点按微调。 */
    appearance: textfield;
  }

  .row-value::-webkit-outer-spin-button,
  .row-value::-webkit-inner-spin-button { appearance: none; margin: 0; }

  .row-value:hover { border-color: var(--line); }
  .row-value:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.35); outline: none; }

  .row-unit {
    color: var(--faint);
    font: 9.5px/16px var(--mono);
    text-align: left;
  }

  .row-range {
    grid-column: 1 / -1;
    width: 100%;
    height: 14px;
    margin: 1px 0 0;
    accent-color: var(--accent);
  }

  .row.is-changed .row-label { color: var(--warn); }
  .row.is-changed .row-label::after { content: " •"; }

  .row.is-driven { opacity: 0.55; }
  .row.is-driven .row-label::before { content: "自动 "; color: var(--accent); font-size: 9.5px; }

  /* ---------------------------------------------------------------- 下拉框 */
  .select-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 1.35fr;
    align-items: center;
    column-gap: var(--row-gap);
    padding: 6px 0 8px;
  }

  select {
    width: 100%;
    height: 26px;
    padding: 0 6px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--panel-soft);
    color: var(--ink);
    font: 11px var(--mono);
    cursor: pointer;
  }

  select:hover { border-color: var(--accent); }
  select:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  /* 弹层由系统绘制，必须显式给 option 上色，否则白底浅字。 */
  select option {
    background: var(--panel-soft);
    color: var(--ink);
  }

  /* ---------------------------------------------------------------- 窄屏 */
  @media (max-width: 860px) {
    #panel {
      top: auto;
      height: 52%;
      width: 100%;
      border-left: 0;
      border-top: 1px solid var(--line-strong);
    }

    #readout { bottom: calc(52% + 8px); }
  }
</style>
<!--
  只映射一个裸标识符 "three"。three.module.js 内部用相对路径 import './three.core.js'，
  所以不需要额外的映射项，也不需要打包器。
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="readout">初始化…</div>
<aside id="panel" aria-label="墨线管线控制面板"></aside>
<script type="module" src="./src/demo/main.js"></script>
</body>
</html>
